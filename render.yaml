services:
  - type: web
    name: jev-paper
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node --max-old-space-size=400 server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: LIVE_ENABLED
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
      - key: KEEPALIVE_URL
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: PUMPPORTAL_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
